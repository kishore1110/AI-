global:
  scrape_interval: 60s       # Scrape every 60 s — keeps HF Spaces load minimal
  evaluation_interval: 60s
  scrape_timeout: 30s

scrape_configs:
  # ---------- Cattle Classification API on Hugging Face Spaces ----------
  - job_name: "cattle_classification_api"
    scheme: https
    static_configs:
      - targets:
          # Replace with your actual HF Space URL (no https://, no trailing slash)
          - "cattlex-cattle-classification-api.hf.space"
    metrics_path: /metrics
    tls_config:
      insecure_skip_verify: false
    # Relabel to add a friendly environment label
    relabel_configs:
      - target_label: environment
        replacement: huggingface_spaces
